name: CI

on:
  pull_request:
  push:
    branches: [main, en]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template:
    name: Шаблон и документы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Согласованность документов, ссылок и версий
        run: node .github/scripts/check-consistency.mjs
      - name: Русская и английская версии совпадают
        run: |
          git fetch --quiet origin main en
          node .github/scripts/check-parity.mjs --allow-version-skew
      - name: ShellCheck
        run: shellcheck --severity=warning .starter-kit/preflight.sh .starter-kit/hooks/pre-commit .github/scripts/*.sh
      - name: Тесты preflight.sh
        run: bash .github/scripts/test-preflight.sh
      - name: Архив релиза содержит только Starter Kit
        run: |
          archive=$(bash .github/scripts/build-release.sh)
          unzip -Z1 "$archive" > files.txt
          if grep -E '^(\.github/|\.gitattributes$|\.starter-kit-source$|LICENSE$|CHANGELOG\.md$)' files.txt; then
            echo "В архив попали служебные файлы"; exit 1
          fi
          grep -qx 'AGENTS.md' files.txt && grep -qx '.starter-kit/preflight.sh' files.txt

  secrets:
    name: Поиск секретов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (вся история коммитов)
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner --verbose
