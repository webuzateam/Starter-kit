name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Проверки
        run: |
          node .github/scripts/check-consistency.mjs
          bash .github/scripts/test-preflight.sh
      - name: Версия тега совпадает с VERSION
        run: |
          version=$(tr -d '[:space:]' < .starter-kit/VERSION)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Тег $GITHUB_REF_NAME не совпадает с VERSION $version"; exit 1; }
      - name: Архив шаблона
        id: build
        run: echo "archive=$(bash .github/scripts/build-release.sh)" >> "$GITHUB_OUTPUT"
      - name: Текст релиза из CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          printf '\n---\n\nУстановка: `npx degit webuzateam/Starter-kit#%s my-project` или распакуйте архив ниже в корень проекта.\n' "$GITHUB_REF_NAME" >> release-notes.md
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.archive }}" --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
