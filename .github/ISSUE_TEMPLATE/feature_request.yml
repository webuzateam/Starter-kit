name: Предложение
description: Идея нового правила, сценария или улучшения сайта
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую проблему это решает
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое решение
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Рассмотренные альтернативы
